<h2>工单、账号与安全说明</h2>

<h3>如何提交有效工单</h3>
<p>请选择对应问题类型，并提供必要信息：账号邮箱、订单号、客户端名称与版本、错误原文和截图。不要在工单中发送登录密码或支付私钥。</p>

<h3>订阅安全</h3>
<ul>
  <li>订阅链接、Token 和 UUID 都属于敏感凭证，不要共享给他人。</li>
  <li>不要把订阅粘贴到来源不明的转换网站、测速网站或脚本中。</li>
  <li>发现异常设备、异地拉取或订阅泄露时，请立即重置订阅。</li>
</ul>

<h3>联系渠道</h3>
<p>客服入口：<a href="{{supportUrl}}">{{supportName}}</a></p>
<p>Telegram 群组：<a href="{{telegramUrl}}">{{telegramUrl}}</a></p>
<p>如果当前站点未配置外部客服或群组，请直接使用站内工单，处理记录会保留在账号中。</p>

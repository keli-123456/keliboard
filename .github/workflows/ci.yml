name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  machine-acceptance-tools:
    name: Isolated acceptance tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check staging, driver journal, diagnostics and synthetic verifier guards (Windows)
        if: runner.os == 'Windows'
        working-directory: tools/machine-acceptance
        run: python -m unittest -v test_staging test_bootstrap_diagnostics test_diagnostic_capture test_runtime_payload test_cli_error_capture test_probe_sampling test_entry_probe_diagnostics test_entry_probe_capture test_driver_journal test_controller_readiness test_install_only_runner test_worker.WorkerTests test_driver_linux test_application_bundle test_entry_probe_linux test_entry_probe_iputils test_iputils_namespace test_runtime_diagnostics test_runtime_projection_chain
      - name: Check staging, driver journal, diagnostics and synthetic verifier guards (isolated Linux)
        if: runner.os == 'Linux'
        working-directory: tools/machine-acceptance
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          uid="$(id -u)"
          gid="$(id -g)"
          py="$(command -v python)"
          libdir="$("$py" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          private_home="$(mktemp -d "$RUNNER_TEMP/keli-acceptance-home.XXXXXX")"
          chmod 700 "$private_home"
          trap 'rmdir -- "$private_home" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=5s 240s \
            sudo /usr/bin/unshare --net --pid --fork --mount-proc --kill-child=SIGKILL \
            /usr/bin/setpriv --reuid "$uid" --regid "$gid" --clear-groups \
            --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs \
            /usr/bin/env -i PATH="$(dirname "$py"):/usr/bin:/bin" HOME="$private_home" \
            LD_LIBRARY_PATH="$libdir" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_LFS_SKIP_SMUDGE=1 \
            "$py" -B -m unittest -v test_staging test_bootstrap_diagnostics test_diagnostic_capture \
            test_runtime_payload test_cli_error_capture \
            test_probe_sampling test_entry_probe_diagnostics test_entry_probe_capture test_driver_journal test_controller_readiness test_install_only_runner \
            test_worker.WorkerTests test_driver_linux test_application_bundle test_entry_probe_linux test_entry_probe_iputils test_iputils_namespace test_runtime_diagnostics test_runtime_projection_chain

  entry-probe-real-iputils:
    name: Real iputils single-packet kernel regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated kernel test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends iputils-ping iproute2 nftables
      - name: Check real ICMP on private loopback only
        working-directory: tools/machine-acceptance
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          parent_netns="$(readlink /proc/self/ns/net)"
          timeout --signal=TERM --kill-after=5s 90s \
            sudo /usr/bin/unshare --net --pid --fork --mount-proc --kill-child=SIGKILL \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 KELI_IPUTILS_NAMESPACE=1 \
            /usr/bin/python3 -B iputils_namespace.py --uid "$(id -u)" --gid "$(id -g)" \
            --parent-netns "$parent_netns" --output "$RUNNER_TEMP/iputils-kernel.json"
      - name: Upload aggregate kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iputils-kernel-aggregate
          path: ${{ runner.temp }}/iputils-kernel.json
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate composer manifests
        run: composer validate --strict

      - name: Verify composer platform pin
        run: php scripts/verify-composer-platform.php

      - name: Verify PHP security baseline
        run: |
          php scripts/verify-php-security.tests.php
          php scripts/verify-php-security.php

      - name: Verify admin asset versions
        run: php scripts/verify-admin-xboard-assets.php

      - name: Test isolated machine installer dependency handling
        run: |
          bash scripts/test-machine-install-apt.sh
          bash scripts/test-machine-install-ping.sh

      - name: Run release preflight guards
        shell: pwsh
        run: |
          ./scripts/release-preflight.ps1 `
            -ReleaseVersion v0.0.0-preflight `
            -SkipTagCheck `
            -SkipAdminRepo `
            -SkipKelinodeRepo

      - name: Test full-stack release manifest guards
        run: php scripts/verify-release-manifest.tests.php

      - name: Test deployment gates and receipts
        run: |
          php scripts/release-smoke.tests.php
          php scripts/verify-deployment-receipt.tests.php
          php scripts/deploy-release.tests.php
          php scripts/deploy-release.integration.tests.php
          php scripts/update.integration.tests.php

      - name: Verify full-stack release contract
        shell: pwsh
        run: ./scripts/release-full-stack.tests.ps1

      - name: Verify lock platform compatibility
        run: composer check-platform-reqs --lock --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check runtime payload and safe PHP exception projection (offline)
        working-directory: tools/machine-acceptance
        run: python3 -B -m unittest -v test_runtime_payload test_cli_error_capture

      - name: Verify installed platform requirements
        run: composer check-platform-reqs --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit --colors=always

  giftcard-mysql-acceptance:
    name: Gift card MySQL (${{ matrix.isolation }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        isolation: ["REPEATABLE READ", "READ COMMITTED"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keli_acceptance_giftcard
          MYSQL_USER: keli_acceptance
          MYSQL_PASSWORD: ephemeral-ci-fixture-only
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root-only
        ports:
          - 127.0.0.1::3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      KELI_GIFTCARD_MYSQL_ACCEPTANCE: "1"
      KELI_GIFTCARD_DB_HOST: "127.0.0.1"
      KELI_GIFTCARD_DB_NAME: keli_acceptance_giftcard
      KELI_GIFTCARD_DB_USER: keli_acceptance
      KELI_GIFTCARD_DB_PASSWORD: ephemeral-ci-fixture-only
      KELI_GIFTCARD_ISOLATION: ${{ matrix.isolation }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, pdo_sqlite, mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Install test dependencies without application startup
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify packaged plugin loading
        run: php scripts/verify-plugin-layout.php
      - name: Exercise real concurrent redemptions against the disposable database
        env:
          KELI_GIFTCARD_DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          mkdir -p artifacts
          vendor/bin/phpunit -c phpunit-mysql.xml --log-junit artifacts/giftcard-mysql.xml
      - name: Preserve acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giftcard-mysql-${{ strategy.job-index }}
          path: artifacts/giftcard-mysql.xml
          if-no-files-found: ignore
          retention-days: 7

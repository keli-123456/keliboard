name: Failover Example Preserve Local V2Board Config

on:
  push:
    branches: [audit/failover-example-v2board-linux-20261120-0e92f73d]

permissions:
  contents: read

jobs:
  real-octane:
    name: Real Octane original config bind, independent cache and rollback
    if: github.repository == 'keli-123456/keliboard' && github.event_name == 'push' && github.ref_name == 'audit/failover-example-v2board-linux-20261120-0e92f73d'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, curl, pcntl, posix
          tools: composer:v2
          coverage: none
      - name: Verify source pins and install dependencies without booting the app
        shell: bash
        run: |
          set -euo pipefail
          target=0e92f73dc987156d65bb2399eaddf904d607330f
          base=984af21185a71879425a9796aadc22ef8f745d62
          git merge-base --is-ancestor "$target" HEAD
          test "$(git rev-parse "$target^")" = "$base"
          test -z "$(git diff --name-only "$target" HEAD -- . ':!.ci-octane' ':!.github/workflows/ci.yml')"
          test -z "$(git diff --name-only "$base" "$target" -- . ':!app' ':!config' ':!public/assets/admin-xboard' ':!tests' ':!tools/failover-example')"
          test ! -e .env
          mkdir "$RUNNER_TEMP/octane-old-source"
          git -c core.autocrlf=false -c core.eol=lf archive "$base" | tar -xf - -C "$RUNNER_TEMP/octane-old-source"
          composer --working-dir="$RUNNER_TEMP/octane-old-source" install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress
      - name: Build local Swoole fixture from the pinned application base
        shell: bash
        run: |
          set -euo pipefail
          image="keli-octane-fixture:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="$(awk 'NR==1 && $1=="FROM" {print $2}' Dockerfile)"
          [[ "$base" =~ ^phpswoole/swoole:php8\.2-alpine@sha256:[a-f0-9]{64}$ ]]
          docker build --pull --build-arg "SWOOLE_BASE=$base" --tag "$image" .ci-octane
          docker run --network none --rm --entrypoint php "$image" -r 'exit(extension_loaded("swoole") && extension_loaded("pcntl") && extension_loaded("posix") && PHP_VERSION_ID>=80200 && PHP_VERSION_ID<80300 ? 0 : 1);'
      - name: Exercise only the isolated Compose project and Unix ACL fixture
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 HOME=/root \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -B .ci-octane/check.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Retain only bounded test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-example-v2board-preserved-0e92f73d
          path: ${{ runner.temp }}/octane-web-only-evidence.json
          if-no-files-found: warn
          retention-days: 7

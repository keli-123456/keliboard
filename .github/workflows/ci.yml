name: CI

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate composer manifests
        run: composer validate --strict

      - name: Verify composer platform pin
        run: php scripts/verify-composer-platform.php

      - name: Verify lock platform compatibility
        run: composer check-platform-reqs --lock --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify installed platform requirements
        run: composer check-platform-reqs --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit --colors=always

name: Bootstrap Execution Linux Acceptance

on:
  push:
    branches: [audit/bootstrap-lifecycle-linux-20261112-a701aa72]

permissions:
  contents: read

concurrency:
  group: bootstrap-lifecycle-linux-20261112-a701aa72
  cancel-in-progress: false

jobs:
  linux-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, xml, openssl, zip, intl, bcmath, gd, posix
          tools: composer:v2
          coverage: none
      - name: Install pinned dependencies without application startup
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify isolated source context
        run: |
          mkdir -p artifacts
          python tools/machine-acceptance/ci_linux_evidence.py verify
      - name: Run real Bash lifecycle and PHP regressions without a network
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- env PATH="$PATH" HOME="$HOME" HOST_NET_NS="$(readlink /proc/self/ns/net)" KELI_LINUX_CI_EVIDENCE_DIR="$PWD/artifacts" bash -c '
            set -e
            python tools/machine-acceptance/ci_linux_evidence.py namespace
            php vendor/bin/phpunit --colors=never --filter "MachineProvisionBootstrapTest|MachineProvisionCompressionTest|MachineControllerInstallCommandTest|MachineReleaseControllerTest|MachineProvisionTest|MachineJsonProvisionTest" --log-junit artifacts/phpunit.xml
          '
      - name: Run synthetic probe and permission checks without a network
        if: always()
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- env PATH="$PATH" HOME="$HOME" HOST_NET_NS="$(readlink /proc/self/ns/net)" bash -c '
            cd tools/machine-acceptance
            python ci_linux_evidence.py python-tests
          '
      - name: Validate aggregate evidence
        if: always()
        run: python tools/machine-acceptance/ci_linux_evidence.py aggregate
      - name: Preserve aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-lifecycle-linux
          path: artifacts/linux-execution-result.json
          if-no-files-found: error
          retention-days: 7

name: Failover Example Linux Acceptance

on:
  push:
    branches: [audit/failover-example-linux-20261119-0e92f73d]

permissions:
  contents: read

jobs:
  isolated:
    name: Isolated Unix socket and rollback
    if: github.repository == 'keli-123456/keliboard' && github.event_name == 'push' && github.ref_name == 'audit/failover-example-linux-20261119-0e92f73d'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, zip, curl
          coverage: none
          tools: composer:v2
      - name: Verify candidate pin and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          base=0e92f73dc987156d65bb2399eaddf904d607330f
          test "$(git rev-parse HEAD^)" = "$base"
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/ci.yml .ci-example/client.php .ci-example/run.py .ci-example/sandbox.py | sort)"
          test "$actual" = "$expected"
          test ! -e .env
          composer install --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Run actual Linux socket and supervisor isolation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 HOME=/root \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -B .ci-example/run.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$(readlink -f "$(command -v php)")"
      - name: Upload only the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-example-linux-0e92f73d
          path: ${{ runner.temp }}/failover-example-result.json
          if-no-files-found: error
          retention-days: 7

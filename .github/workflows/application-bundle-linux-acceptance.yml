name: Application Bundle Linux Isolated Acceptance

on:
  push:
    branches: [audit/application-bundle-linux-20261112-aba1ce17]

permissions:
  contents: read

jobs:
  offline-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify offline fixtures and archived two-line Bash prefixes
        run: python -B tools/machine-acceptance/application_bundle_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-bundle-linux-aggregate
          path: artifacts/application-bundle-ci.json
          if-no-files-found: error
          retention-days: 7

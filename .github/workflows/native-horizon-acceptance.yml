name: Isolated empty worker startup

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  empty-worker:
    if: github.ref_name == 'codex/operator-empty-worker-ci-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    name: Empty worker (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case: [heartbeat, missing-signal, missing-socket]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pcntl, posix, redis, pdo_sqlite, mbstring, openssl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts
      - name: Acquire disposable Redis runtime
        run: docker pull redis:7-alpine
      - name: Exercise isolated PHP process and retain sanitized evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_WORKFLOW,GITHUB_REF_NAME,GITHUB_REPOSITORY,GITHUB_WORKSPACE \
            python3 -B tests/Fixtures/ci_empty_worker.py "${{ matrix.case }}" >artifacts/isolation.json
          cat artifacts/isolation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-${{ matrix.case }}
          path: artifacts/isolation.json
          retention-days: 7

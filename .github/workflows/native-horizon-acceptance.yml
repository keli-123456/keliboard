name: Manual failover isolated process limits

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  isolation:
    if: github.ref_name == 'codex/operator-handover-ci-20261127'
    name: Isolated Linux (${{ matrix.fault }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        fault: [kill, timeout, limits, recovery]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keli_acceptance_native_failover
          MYSQL_USER: keli_native_fixture
          MYSQL_PASSWORD: ephemeral-operator-ci-only
          MYSQL_ROOT_PASSWORD: ephemeral-operator-root-only
        ports: ["127.0.0.1::3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=24
      redis:
        image: redis:7-alpine
        ports: ["127.0.0.1::6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      KELI_NATIVE_ACCEPTANCE: "1"
      KELI_NATIVE_HOST: 127.0.0.1
      KELI_NATIVE_DATABASE: keli_acceptance_native_failover
      KELI_NATIVE_USER: keli_native_fixture
      KELI_NATIVE_PASSWORD: ephemeral-operator-ci-only
      KELI_NATIVE_ISOLATION: REPEATABLE READ
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, pdo_sqlite, redis, pcntl, posix, mbstring, openssl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Regression for handover, receipts and business lanes
        if: matrix.fault == 'recovery'
        run: >-
          php vendor/bin/phpunit --do-not-cache-result
          --filter '(MachineFailoverHandoverTest|test_handover_|test_operator_|test_revoked_operator|StatBatchJobsTest|StatUserJobTest|TrafficFetchJobTest|TrafficBatchServiceTest|test_authenticated_receipt_is_idempotent|test_receipts_need_bearer|test_public_receipt_route)'
          tests/Unit/Services/MachineFailoverNativeBridgeTest.php
          tests/Unit/Services/MachineFailoverHandoverTest.php
          tests/Unit/Jobs/StatBatchJobsTest.php tests/Unit/Jobs/StatUserJobTest.php tests/Unit/Jobs/TrafficFetchJobTest.php
          tests/Unit/Services/TrafficBatchServiceTest.php tests/Unit/Services/MachineProvisionTest.php
      - name: Exercise kernel fault with live isolated business queues
        env:
          KELI_NATIVE_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          KELI_NATIVE_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -B tests/Fixtures/ci_operator_isolation.py ${{ matrix.fault }} | tee artifacts/isolation.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: isolation-${{ matrix.fault }}
          path: artifacts/isolation.json
          retention-days: 7

name: Failover Trigger Preview Isolated Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-preview-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Trigger preview (${{ matrix.isolation }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        isolation: ["REPEATABLE READ", "READ COMMITTED"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keli_acceptance_native_failover
          MYSQL_USER: keli_native_fixture
          MYSQL_PASSWORD: ephemeral-native-ci-only
          MYSQL_ROOT_PASSWORD: ephemeral-native-root-only
        ports:
          - 127.0.0.1::3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1::6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      KELI_NATIVE_ACCEPTANCE: "1"
      KELI_TRIGGER_PREVIEW_ACCEPTANCE: "1"
      KELI_NATIVE_HOST: "127.0.0.1"
      KELI_NATIVE_DATABASE: keli_acceptance_native_failover
      KELI_NATIVE_USER: keli_native_fixture
      KELI_NATIVE_PASSWORD: ephemeral-native-ci-only
      KELI_NATIVE_ISOLATION: ${{ matrix.isolation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, pdo_sqlite, redis, pcntl, posix, mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Install test dependencies without application startup
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Run cache-only scheduling with real InnoDB and Redis
        env:
          KELI_NATIVE_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          KELI_NATIVE_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
        run: |
          mkdir -p artifacts
          vendor/bin/phpunit -c phpunit-trigger-preview.xml --stop-on-error --stop-on-failure --log-junit artifacts/trigger-preview.xml
      - name: Preserve aggregate acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-preview-${{ strategy.job-index }}
          path: |
            artifacts/trigger-preview.xml
            artifacts/trigger-preview-summary.jsonl
          if-no-files-found: ignore
          retention-days: 7

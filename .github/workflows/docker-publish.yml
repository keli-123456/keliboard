name: Docker Build and Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main", "master", "new-dev"]
  workflow_dispatch:
    inputs:
      candidate_only:
        description: "Build and verify an immutable candidate without promoting release aliases"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_version=$(date '+%Y%m%d')-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.SOURCE_BRANCH }}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}
            type=raw,value=new,enable=${{ env.SOURCE_BRANCH == 'master' || env.SOURCE_BRANCH == 'main' }}
            type=raw,value=latest,enable=${{ env.SOURCE_BRANCH == 'master' || env.SOURCE_BRANCH == 'main' }}
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build candidate image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ env.SOURCE_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_GIT_SHA=${{ env.SOURCE_SHA }}
            BUILD_VERSION=${{ steps.release.outputs.build_version }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host

      - name: Verify candidate PHP and dependencies on both architectures
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          for architecture in amd64 arm64; do
            platform_digest="$(jq -er --arg arch "$architecture" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("Expected exactly one platform manifest") end
            ' <<< "$manifest")"
            [[ "$platform_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "Verifying linux/$architecture: $platform_digest"
            docker run --rm --network none --platform "linux/$architecture" --entrypoint php \
              "$IMAGE@$platform_digest" scripts/verify-php-security.php --container
            docker run --rm --network none --platform "linux/$architecture" --entrypoint composer \
              "$IMAGE@$platform_digest" check-platform-reqs --no-dev --no-interaction
            docker run --rm --network none --platform "linux/$architecture" --entrypoint php \
              "$IMAGE@$platform_digest" scripts/verify-plugin-layout.php
          done

      - name: Promote verified image
        if: github.event_name != 'workflow_dispatch' || !inputs.candidate_only
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0
        with:
          cosign-release: 'v2.2.2'

      - name: Sign image
        if: steps.build-and-push.outputs.digest != ''
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes "{}@${{ steps.build-and-push.outputs.digest }}"

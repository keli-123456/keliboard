name: R35 Temporary Assembly Linux Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r35-assembly-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-assembly:
    if: github.ref == 'refs/heads/acceptance/r35-assembly-linux-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, redis, pcntl, posix, mbstring, bcmath, sockets, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without starting the application
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Mocked interfaces with real Linux processes and no external routes
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p artifacts
          sudo timeout --signal=TERM --kill-after=15s 1200s \
            unshare --net --pid --fork --mount-proc --mount --kill-child=SIGKILL \
            /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python3 "$GITHUB_WORKSPACE/audit/r35-assembly-linux-ci.py" \
            > artifacts/isolated-assembly.log 2>&1
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-assembly-isolated-linux-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

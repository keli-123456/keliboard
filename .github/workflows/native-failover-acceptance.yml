name: R35 Full Application Linux Acceptance

on:
  workflow_dispatch:
    inputs:
      cleanup_regression:
        type: boolean
        default: false
        description: Run bounded cleanup regressions only; no service containers.
      install_entry_only:
        type: boolean
        default: false
        description: Verify the real application installation CLI and shared stop lock only.
      agent_http_only:
        type: boolean
        default: false
        description: Verify scoped real agent API forms via isolated TLS and the full HTTP kernel.

permissions:
  contents: read

concurrency:
  group: r35-application-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup-regression:
    if: ${{ inputs.cleanup_regression }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pcntl, posix, mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies without application startup
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Run cleanup regressions without an external network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          timeout --signal=TERM --kill-after=15s 300s sudo unshare --net --pid --fork --mount-proc --kill-child=SIGKILL \
            env -i PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 HOME=/root \
            PYTHONDONTWRITEBYTECODE=1 bash -eu -c '
              test -z "$(ip -4 route show)"
              test -z "$(ip -6 route show)"
              cd tools/machine-acceptance
              python3 -B -m unittest -v test_member_assembly test_member_execution.ExecutionTests test_member_private_cleanup test_member_round test_member_transport test_member_remote_setup >../../artifacts/cleanup-python.log 2>&1
              cd ../..
              php vendor/phpunit/phpunit/phpunit tests/Unit/Services/MachineMemberProviderBindingsTest.php >artifacts/cleanup-php.log 2>&1
              test ! -e /opt/keli-isolated
              printf "{\"status\":\"passed\",\"external_routes\":false,\"cloud_ssh_dns\":\"simulated\",\"full_round\":false,\"production_access\":false}\n" >artifacts/cleanup-summary.json
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r35-cleanup-linux-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  isolated-services:
    if: ${{ !inputs.cleanup_regression }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, redis, pcntl, posix, mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies without application startup
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Start disposable services with no external network or published ports
        shell: bash
        run: |
          set -euo pipefail
          docker pull mysql:8.4
          docker pull redis:7-alpine
          name="r35-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$name-mysql" --label "keli.fixture=$name" --network none \
            -e MYSQL_DATABASE=keli_acceptance_application -e MYSQL_USER=keli_application \
            -e MYSQL_PASSWORD=ssssssssssssssssssssssssssssssss -e MYSQL_ROOT_PASSWORD=ephemeral-native-root-only \
            mysql:8.4 --port=13306 --bind-address=127.0.0.1
          docker run -d --name "$name-redis" --label "keli.fixture=$name" --network "container:$name-mysql" \
            redis:7-alpine redis-server --bind 127.0.0.1 --port 16379 --requirepass rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr --save '' --appendonly no
          for i in $(seq 1 90); do
            if docker exec "$name-mysql" mysqladmin ping --silent && \
              docker exec "$name-redis" redis-cli -p 16379 -a rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr --no-auth-warning ping | grep -qx PONG; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check execution bindings, real HTTP and isolated databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          name="r35-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pid="$(docker inspect -f '{{.State.Pid}}' "$name-mysql")"
          test "$pid" -gt 1
          mode=--retry-flow
          if [ '${{ inputs.install_entry_only }}' = true ]; then mode=--install-entry-only; fi
          if [ '${{ inputs.agent_http_only }}' = true ]; then mode=--agent-http-only; fi
          timeout --signal=TERM --kill-after=15s 1800s sudo nsenter --net="/proc/$pid/ns/net" \
            unshare --pid --fork --mount-proc --kill-child=SIGKILL \
            env -i PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 HOME=/root \
            PYTHONDONTWRITEBYTECODE=1 python3 -B audit/r35-application-linux-ci.py "$mode" >artifacts/application-linux.log 2>&1
      - name: Retain bounded nonsecret status even if artifact upload fails
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/application-linux-summary.json')
          if p.is_file():
              s = json.loads(p.read_bytes())
              keys = ('status', 'failure_class', 'failure_check', 'native_rpc_last_error', 'native_retry_last_state')
              print(json.dumps({k: s[k] for k in keys if k in s}, sort_keys=True))
          else:
              print('No completed application summary; absence is not success.')
          PY
      - name: Delete only this run's service containers and anonymous volumes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          name="r35-application-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for suffix in redis mysql; do
            container="$name-$suffix"
            if docker inspect "$container" >/dev/null 2>&1; then
              test "$(docker inspect -f '{{index .Config.Labels "keli.fixture"}}' "$container")" = "$name"
              docker rm -fv "$container"
            fi
            ! docker inspect "$container" >/dev/null 2>&1
          done
          if sudo test -e /opt/keli-isolated; then
            test "$(sudo cat /opt/keli-isolated/.r35-application-fixture)" = "$GITHUB_SHA"
            sudo test ! -L /opt/keli-isolated
            sudo rm -rf -- /opt/keli-isolated
          fi
          test ! -e /opt/keli-isolated
          mkdir -p artifacts
          printf '{"containers_removed":true,"fixed_fixture_removed":true}\n' >artifacts/service-cleanup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r35-application-linux-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

name: R35 Temporary Linux Assembly Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r35-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-linux:
    if: github.ref == 'refs/heads/acceptance/r35-round-linux-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, pcntl, posix, bcmath, sockets, zip, redis
          coverage: none
      - name: Exact frozen package in a no-route namespace, as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo unshare --net bash -c 'set -euo pipefail; ip link set lo up; exec runuser -u runner -- env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/home/runner TMPDIR=/tmp python3 "$1/audit/r35-linux-ci.py"' bash "$GITHUB_WORKSPACE" > artifacts/isolated-linux.log 2>&1
      - name: Preserve synthetic-only test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-isolated-linux-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

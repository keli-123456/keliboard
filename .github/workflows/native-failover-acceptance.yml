name: usdo1 Temporary Kernel and Native Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdo1-isolated-board-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated:
    if: github.ref == 'refs/heads/acceptance/usdo1-isolated-linux-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, fileinfo, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install locked test dependencies and kernel tools
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends nftables iproute2 iputils-ping
      - name: Test native task, stop, and independent rollback without network
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo -n unshare --net -- bash -euc '
            ip link set lo up
            test -z "$(ip route show default)"
            exec env -i PATH="$PATH" APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_DRIVER=array "$@"
          ' bash "$(command -v php)" vendor/bin/phpunit --do-not-cache-result --stop-on-failure --stop-on-error --log-junit artifacts/native.xml \
            --filter 'MachineUsdo1(Round|ExistingA)Test|MachineDnsRecordSet(Planner|Wire)Test|test_usdo1_bound_native|test_parent_stop_fences_native' tests/Unit/Services
          python3 -B -m unittest discover -s tools/machine-acceptance -p test_usdo1_fault_lease.py
      - name: Kill isolated controller and observe real kernel expiry
        run: |
          set -euo pipefail
          sudo -n "$(command -v python3)" -B tools/machine-acceptance/usdo1_linux_lease_check.py | tee artifacts/lease.json
      - name: Seal redacted evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lease = json.loads(Path('artifacts/lease.json').read_text())
          assert all(lease[key] is True for key in ('isolated_linux', 'controller_killed', 'icmp_recovered', 'non_target_unaffected'))
          assert 0 < lease['seconds_since_loss'] <= 90
          suite = ET.parse('artifacts/native.xml')
          cases = list(suite.iter('testcase'))
          assert len(cases) >= 20 and not any(case.find(tag) is not None for case in cases for tag in ('error', 'failure', 'skipped'))
          proof = {'schema': 1, 'kind': 'board-usdo1-linux', 'git_sha': os.environ['GITHUB_SHA'],
                   'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'linux_kernel': os.uname().release, 'cloud_and_dns_simulated': True,
                   'php_passed': len(cases), 'lease_model_passed': 7, 'lease': lease}
          Path('artifacts/board-attestation.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usdo1-board-linux-evidence
          path: artifacts/board-attestation.json
          if-no-files-found: error
          retention-days: 7
